<!DOCTYPE html>
<!-- Source for fven-image.png (social preview, 1200x630).
     Regenerate: open in Chrome at 1200x630 and screenshot, or
     chrome --headless --screenshot=fven-image.png --window-size=1200,630 fven-image.html -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>fven.xyz social preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #050505;
        --surface: #0a0a0a;
        --border: #1c1c1c;
        --fg: #fafafa;
        --fg-muted: #8b8b94;
        --accent: #10b981;
        --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
        --font-sans: 'Inter', -apple-system, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        display: grid;
        grid-template-columns: 1fr 500px;
        column-gap: 64px;
        align-items: center;
        padding: 0 72px;
        position: relative;
    }

    .label {
        font-family: var(--font-mono);
        font-size: 20px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--fg-muted);
        margin-bottom: 28px;
    }

    .label span { color: var(--accent); }

    h1 {
        font-size: 76px;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.05;
        margin-bottom: 24px;
    }

    .role {
        font-size: 32px;
        color: var(--fg-muted);
        letter-spacing: -0.01em;
        margin-bottom: 40px;
    }

    .erc {
        font-family: var(--font-mono);
        font-size: 22px;
        color: var(--fg);
    }

    .erc span { color: var(--accent); }

    .code-block {
        font-family: var(--font-mono);
        font-size: 21px;
        line-height: 1.75;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 26px 32px 30px;
    }

    .file {
        font-size: 16px;
        color: #52525b;
        border-bottom: 1px solid var(--border);
        padding-bottom: 12px;
        margin-bottom: 18px;
    }

    .keyword { color: #f472b6; }
    .function { color: #34d399; }
    .string { color: #fbbf24; }
    .number { color: #818cf8; }

    .indent {
        padding-left: 28px;
        border-left: 1px solid var(--border);
        margin-left: 4px;
    }

    .site {
        position: absolute;
        left: 72px;
        bottom: 44px;
        font-family: var(--font-mono);
        font-size: 20px;
        color: var(--fg-muted);
    }

    .bar {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 6px;
        background: var(--accent);
    }
</style>
</head>
<body>
    <div>
        <div class="label"><span>#</span> whoami</div>
        <h1>Filipe Venancio</h1>
        <div class="role">Smart Contract Engineer</div>
        <div class="erc"><span>#</span> Author of ERC-8473</div>
    </div>

    <div class="code-block">
        <div class="file">fven.ts</div>
        <div><span class="keyword">const</span> <span class="function">filipe</span> = {</div>
        <div class="indent">
            <div>company: <span class="string">"State Street"</span>,</div>
            <div>focus: <span class="string">"DeFi Infrastructure"</span>,</div>
            <div>defiSince: <span class="number">2020</span>,</div>
            <div>codingSince: <span class="number">2008</span></div>
        </div>
        <div>};</div>
    </div>

    <div class="site">fven.xyz</div>
    <div class="bar"></div>
</body>
</html>
